<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ojwang Mariam | Tuko Kadi — Kahawa West 2027</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This 404.html file redirects any unknown path back to index.html,
      // encoding the original path in the query string so the app can
      // restore it once React Router loads.
      var pathSegmentsToKeep = 0 // keep "/ojwangmariam"

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
